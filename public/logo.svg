<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="white"></rect>

  <!-- Logo Symbol (V shape gradient) -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7B61FF;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1"></stop>
    </linearGradient>
  </defs>

  <!-- Left part of V -->
  <path d="M200 100 L270 250 L240 250 L170 100 Z" fill="url(#grad1)"></path>

  <!-- Right part of V -->
  <path d="M300 100 L370 100 L300 250 L270 250 Z" fill="url(#grad1)"></path>

  <!-- Dot -->
  <circle cx="380" cy="90" r="8" fill="#00D4FF"></circle>

  <!-- Text -->
  <text x="300" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="bold">
    <tspan fill="#7B61FF">VOXIVA</tspan>
    <tspan fill="#000000"> AI</tspan>
  </text>
</svg>